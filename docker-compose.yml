services:
  db:
    image: mysql:8.0
    container_name: school_fee_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_fee_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./Documents:/app/Documents
      - ./frontend/public/students:/app/static_students:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_fee_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    # For local development without Nginx reverse proxy, you might mount volumes.
    # We are using a production-ready approach with Nginx serving the built app.

volumes:
  db_data:
